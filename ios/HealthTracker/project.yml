name: HealthTracker
options:
  bundleIdPrefix: com.healthtracker
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

targets:
  HealthTracker:
    type: application
    platform: iOS
    sources:
      - HealthTracker
    settings:
      base:
        INFOPLIST_FILE: HealthTracker/Info.plist
        CODE_SIGN_ENTITLEMENTS: HealthTracker/HealthTracker.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.alexpani.healthtracker.app
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: HealthTracker/HealthTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        # Clinical Health Records (FHIR) — richiede paid Developer Program.
        com.apple.developer.healthkit.access: [health-records]
        # APNs silent push: 'production' funziona sia per build TestFlight/
        # App Store sia per build dev (Xcode automaticamente usa il sandbox
        # APNs endpoint per le dev builds quando aps-environment=development,
        # ma 'production' nel manifesto e' compatibile in dev se l'iOS
        # device e' configurato come tale dal provisioning profile).
        # In caso di problemi in development, mettere `development` qui e
        # rigenerare con xcodegen.
        aps-environment: development

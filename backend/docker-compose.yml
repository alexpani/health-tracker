services:
  db:
    image: postgres:16-alpine
    container_name: health-tracker-db
    environment:
      POSTGRES_DB: health_tracker
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: health-tracker-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://health:health@db:5432/health_tracker
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-7}
      LAB_DOCUMENTS_DIR: /app/data/lab_documents
      MEDICAL_DOCUMENTS_DIR: /app/data/medical_documents
      # --- APNs silent push ---
      # Lasciare i 3 valori vuoti disabilita il push (le call diventano
      # no-op silenziose). Per abilitare: APNs Auth Key da Apple Developer,
      # `apns_key_path` punta al .p8 montato read-only nel volume sotto.
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-com.alexpani.healthtracker.app}
      APNS_KEY_PATH: /app/data/apns/AuthKey.p8
      APNS_DEFAULT_ENV: ${APNS_DEFAULT_ENV:-sandbox}
    volumes:
      - ./alembic/versions:/app/alembic/versions
      - ./data/lab_documents:/app/data/lab_documents
      - ./data/medical_documents:/app/data/medical_documents
      - ./data/apns:/app/data/apns:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:

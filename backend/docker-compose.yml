services:
  db:
    image: postgres:16-alpine
    container_name: health-tracker-db
    environment:
      POSTGRES_DB: health_tracker
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: health-tracker-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://health:health@db:5432/health_tracker
    volumes:
      - ./alembic/versions:/app/alembic/versions
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:

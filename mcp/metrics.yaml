# Catalogo metriche per i tool analitici.
#
# Ogni metric è una subquery che ritorna (t timestamptz, v float).
# I tool aggregate/compare/correlate/find_periods/life_timeline wrappano
# queste subquery con date_trunc + aggregati standard.
#
# Aggiungere una metrica = aggiungere una voce qui. Nessun codice da toccare.
# Hot-reload disponibile via tool `reload_metrics_catalog`.

# ─── Body ────────────────────────────────────────────────────────────────────

body.weight:
  category: body
  unit: kg
  description: Peso corporeo (HKBodyMass)
  query: |
    SELECT start_date AS t, value::float AS v
    FROM health_samples
    WHERE type = 'HKQuantityTypeIdentifierBodyMass'

body.bmi:
  category: body
  unit: ""
  description: Body Mass Index
  query: |
    SELECT start_date AS t, value::float AS v
    FROM health_samples
    WHERE type = 'HKQuantityTypeIdentifierBodyMassIndex'

body.fat_pct:
  category: body
  unit: "%"
  description: Body fat percentage (0-1, da moltiplicare per 100 per la percentuale)
  query: |
    SELECT start_date AS t, (value::float * 100) AS v
    FROM health_samples
    WHERE type = 'HKQuantityTypeIdentifierBodyFatPercentage'

body.lean_mass:
  category: body
  unit: kg
  query: |
    SELECT start_date AS t, value::float AS v
    FROM health_samples
    WHERE type = 'HKQuantityTypeIdentifierLeanBodyMass'

body.waist:
  category: body
  unit: cm
  query: |
    SELECT start_date AS t, (value::float * 100) AS v
    FROM health_samples
    WHERE type = 'HKQuantityTypeIdentifierWaistCircumference'


  description: Passi giornalieri (da daily_stats, dedup HK Watch+iPhone)
  query: |
    SELECT date::timestamptz AS t, value::float AS v
    FROM daily_stats
    WHERE type = 'HKQuantityTypeIdentifierStepCount' AND source IS NULL


# ─── Sleep ───────────────────────────────────────────────────────────────────

sleep.total_h:
  category: sleep
  unit: ore
  description: |
    Durata totale del sonno per notte (in ore). Tutti gli stage tranne InBed e Awake.
    end_date - start_date di ogni record sleepAnalysis non-awake, sommati per notte
    (raggruppando per la data di end).
  query: |
    SELECT end_date AS t,
           (EXTRACT(EPOCH FROM end_date - start_date) / 3600.0)::float AS v
    FROM category_samples
    WHERE type = 'HKCategoryTypeIdentifierSleepAnalysis'
      AND value IN (3, 4, 5)

sleep.deep_h:
  category: sleep
  unit: ore
  query: |
    SELECT end_date AS t,
           (EXTRACT(EPOCH FROM end_date - start_date) / 3600.0)::float AS v
    FROM category_samples
    WHERE type = 'HKCategoryTypeIdentifierSleepAnalysis' AND value = 4

sleep.rem_h:
  category: sleep
  unit: ore
  query: |
    SELECT end_date AS t,
           (EXTRACT(EPOCH FROM end_date - start_date) / 3600.0)::float AS v
    FROM category_samples
    WHERE type = 'HKCategoryTypeIdentifierSleepAnalysis' AND value = 5

# ─── Lab (analiti più frequenti — espandere col tempo) ───────────────────────
# Usano lab_results JOIN lab_analytes; solo panel confirmed.

lab.ldl:
  category: lab
  unit: mg/dL
  query: |
    SELECT p.test_date::timestamptz AS t, r.value_numeric::float AS v
    FROM lab_results r
    JOIN lab_panels p ON r.panel_id = p.id
    JOIN lab_analytes a ON r.analyte_id = a.id
    WHERE a.slug = 'ldl_cholesterol' AND p.status = 'confirmed' AND r.value_numeric IS NOT NULL


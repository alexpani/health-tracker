[project]
name = "health-mcp"
version = "0.1.0"
description = "MCP server for Health Tracker — read-only access for Claude"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]

[project.scripts]
health-mcp = "health_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

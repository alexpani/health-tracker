server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # PDF upload (referti lab / documenti medici) — alza il limite di body.
  client_max_body_size 50m;

  # Proxy dell'API sul backend LXC, cosi' il frontend usa un URL relativo
  # (`/api/...`) same-origin. Servendo la dashboard via HTTPS, questo evita il
  # mixed content (HTTPS page -> HTTP fetch) che Safari blocca senza override.
  location /api/ {
    proxy_pass http://192.168.68.166:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # L'analisi IA di alcuni ingest puo' essere lenta.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # SPA fallback. index.html non va mai cachato: referenzia i bundle JS/CSS
  # con hash nel nome, quindi se il browser tiene la vecchia index.html non
  # vede mai i nuovi deploy finche' non fa hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # Cache static assets for a year
  location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
